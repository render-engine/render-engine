name: Set up uv
description: Install uv with a pinned Python version
inputs:
  python-version:
    description: Python version for uv to install and use
    required: true
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
