name: Type Check

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

jobs:
  ty_check:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/checkout
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run type (ty) check
        run: uv run ty check src
