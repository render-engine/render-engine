name: Build distribution

on:
  release:
    types: [created, published, prereleased]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: write # This is needed for the coverage badge. Will fail on startup without it.

  build-and-inspect-package:
    name: Build & inspect package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: $/.github/actions/checkout
      - uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  publish-pypi:
    needs: build-and-inspect-package
    if: startsWith(github.ref, 'refs/tags/') # only publish to PyPI on tag pushes
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: Packages
      - name: Push to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
